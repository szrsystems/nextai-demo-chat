services:
  - type: web
    name: nextai-demo-chat
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # a kulcsot te ird be a Render felulten, sehol nem taroljuk fajlban
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: ALLOWED_ORIGINS
        value: https://nextai.hu,https://www.nextai.hu,https://magyarai-web.onrender.com
      - key: DAILY_MAX
        value: "800"
      - key: IP_HOURLY_MAX
        value: "25"
